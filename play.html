<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VERTEX プレイ入口</title>
  <style>
    [hidden]{display:none!important}
    *{box-sizing:border-box} body{margin:0;background:#05060c;color:#fff7df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 20%,rgba(255,54,93,.22),transparent 30%),linear-gradient(145deg,#05060c,#16091f)}.card{width:min(460px,92vw);background:#121722;border:1px solid rgba(255,211,106,.45);border-radius:8px;padding:24px;box-shadow:0 20px 70px rgba(0,0,0,.45)}h1{margin:0 0 14px;font-size:26px}.field{display:grid;gap:8px;margin:16px 0}.field input{height:48px;border-radius:6px;border:1px solid #3b4352;background:#070a10;color:#fff;font-size:22px;letter-spacing:.08em;text-align:center;text-transform:uppercase}button{height:44px;border:0;border-radius:6px;padding:0 16px;font-weight:900;cursor:pointer;background:#ffd36a;color:#1c1200}.muted{color:#aab2c2;font-size:13px}.bad{color:#ff8f8f}.topbar{height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#11151e;border-bottom:1px solid #333b49;padding:0 14px}.topbar b{color:#ffe07c}.danger{background:#d94b4b;color:#fff}.slotFrame{width:100%;height:calc(100vh - 54px);border:0;display:block;background:#05060c}.ended{min-height:100vh;display:grid;place-items:center;background:#10141c;text-align:center;padding:24px}.ended h2{font-size:34px;margin:0 0 12px}@media(max-width:700px){.topbar{height:auto;min-height:54px;align-items:flex-start;flex-direction:column;padding:10px}.slotFrame{height:calc(100vh - 96px)}}
  </style>
</head>
<body>
<div id="login" class="login">
  <div class="card">
    <h1><span id="storeName">VERTEX</span> <span id="entryMachineTitle"></span></h1>
    <p class="muted" id="entryHelp">管理画面で発行されたパスワードを入力してください。</p>
    <label class="field"><span>パスワード</span><input id="password" maxlength="12" autocomplete="one-time-code"></label>
    <button id="startBtn" disabled>この台で開始</button>
    <p id="error" class="bad"></p>
  </div>
</div>
<dialog id="speedChoice" aria-labelledby="speedChoiceTitle" style="background:#121722;color:#fff7df;border:1px solid #ffd36a;border-radius:12px;padding:24px;max-width:440px">
<h2 id="speedChoiceTitle">超ハイスピードモードを使用しますか？</h2>
<p>※別途現金100万円頂戴します。</p><p class="muted">同じ営業日は1回分です（翌3時まで）。</p>
<div style="display:flex;gap:16px"><button id="speedYes" type="button">はい</button><button id="speedNo" type="button">いいえ</button></div>
</dialog>
<div id="play" hidden>
  <div class="topbar"><div><b id="machineLabel"></b> <span id="playerLabel"></span></div><button id="endBtn" class="danger">終了してデータ送信</button></div>
  <iframe id="slot" class="slotFrame" allow="autoplay; fullscreen"></iframe>
</div>
<div id="ended" class="ended" hidden>
  <div><h2>終了しました</h2><p id="endSummary">清算データを送信し、台を空席に戻しました。</p><p id="sendStatus" class="muted"></p></div>
</div>
<script>
const $ = id => document.getElementById(id);
let active = null;
let slotOrigin = "";
let customerLogin=false,brandingReady=false;
let resumeState=null, machineDisplayBaseline=null, novaHandoff=false, pendingSnapshot=null;
let machineNames = new Map();
let sessionWatchTimer = null, sessionWatchInFlight = false, sessionWatchRequested = false;
let endingSession = false;
const params = new URLSearchParams(location.search);
const entryMachineId = params.get('machine') || '';
function machineName(machineId){ return machineNames.get(String(machineId)) || String(machineId || ''); }
function enableLastPasswordCharacter(input){
  const wrapper=document.createElement('span');
  wrapper.style.cssText='position:relative;display:block;overflow:hidden;border-radius:6px';
  input.before(wrapper);wrapper.append(input);
  input.style.cssText+=';width:100%;text-align:left;padding:0 12px;font-family:monospace;color:transparent;-webkit-text-fill-color:transparent;caret-color:white';
  const mirror=document.createElement('span');mirror.setAttribute('aria-hidden','true');
  mirror.style.cssText='position:absolute;left:13px;right:13px;top:0;height:48px;display:flex;align-items:center;overflow:hidden;pointer-events:none;font:22px monospace;letter-spacing:.08em;color:white';
  const text=document.createElement('span');text.style.whiteSpace='pre';mirror.append(text);wrapper.append(mirror);
  let timer, visible=-1;
  function draw(){
    text.textContent=Array.from(input.value).map((c,i)=>i===visible?c:'•').join('');
    text.style.transform=`translateX(${-input.scrollLeft}px)`;
  }
  function hide(){clearTimeout(timer);visible=-1;draw();}
  input.addEventListener('input',event=>{
    hide();
    // Pasted/autofilled passwords stay masked; reveal only one typed character.
    if(event.inputType==='insertText'&&event.data&&Array.from(event.data).length===1&&!event.isComposing){
      visible=Array.from(input.value.slice(0,input.selectionStart)).length-1;
      draw();timer=setTimeout(hide,800);
    }
    requestAnimationFrame(draw);
  });
  input.addEventListener('blur',hide);
  input.addEventListener('scroll',draw);
  input.addEventListener('change',hide);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)hide();});
  draw();
}
// Same-origin admin tabs can wake the game without waiting for its next poll.
// Only the notification crosses origins; the game still fetches its server queue.
try{
  const commandWakeChannel = new BroadcastChannel('vertex-command-wake');
  commandWakeChannel.onmessage = event=>{
    if(!active || !slotOrigin || event.data?.type !== 'vertex-commands-available') return;
    if(String(event.data.machineId) !== String(active.machineId)) return;
    wakeSessionWatch();
    $('slot').contentWindow?.postMessage({type:'vertex-commands-available', machineId:String(active.machineId)}, slotOrigin);
  };
}catch(error){}
async function loadBranding(){
  try{
    const [configResponse, machinesResponse] = await Promise.all([fetch('/api/config'), fetch('/api/machines')]);
    const config = await configResponse.json();
    if(!configResponse.ok)throw Error('config');
    customerLogin=config.storeId==='store-debug'&&config.customerLoginEnabled===true&&/^nova-(0[1-9]|1[0-2])$/.test(entryMachineId);
    if(customerLogin){
      const label=document.createElement('label');label.className='field';label.innerHTML='<span>ユーザーID</span><input id="userId" maxlength="32" autocomplete="username" autocapitalize="none" spellcheck="false" style="text-transform:none">';
      $('password').closest('label').before(label);
      $('password').type='password';$('password').maxLength=128;$('password').autocomplete='current-password';$('password').style.textTransform='none';
      enableLastPasswordCharacter($('password'));
    }
    brandingReady=true;$('startBtn').disabled=false;
    const machines = await machinesResponse.json();
    if(config.storeName){ $('storeName').textContent = config.storeName; document.title = `${config.storeName} プレイ入口`; }
    machineNames = new Map((Array.isArray(machines) ? machines : []).map(machine=>[String(machine.machineId), machine.displayName || machine.machineId]));
  }catch(error){$('error').textContent='店舗情報を取得できません。ページを再読み込みしてください。';}
  if(entryMachineId){
    $('entryMachineTitle').textContent = machineName(entryMachineId);
    $('entryHelp').textContent = customerLogin?'登録済みのユーザーIDとパスワードで入場できます。':machineName(entryMachineId) + '用のパスワードを入力してください。';
  }else{
    $('entryMachineTitle').textContent = '';
  }
}
function friendlyError(error){
  const map = {
    "password not found":"パスワードが見つかりません",
    "machine is busy":"この台はすでに使用中です。管理画面で強制終了またはリセットしてください",
    "このパスワードは終了済みです":"このパスワードは終了済みです",
    "このパスワードは別の台用です":"このパスワードは別の台用です"
  };
  return map[error] || error || "開始できません";
}
function chooseCustomerSpeed(){
  return new Promise(resolve=>{
    const dialog=$('speedChoice');
    const finish=value=>{dialog.close();resolve(value);};
    $('speedYes').onclick=()=>finish(true);
    $('speedNo').onclick=()=>finish(false);
    dialog.oncancel=event=>{event.preventDefault();finish(null);};
    dialog.showModal();$('speedNo').focus();
  });
}
async function start(){
  if(!brandingReady)return;
  if($('startBtn').disabled || active) return;
  $('error').textContent = '';
  $('startBtn').disabled = true;
  $('startBtn').textContent = '確認中...';
  const password = customerLogin?$('password').value:$('password').value.trim().toUpperCase();
  if(!password){ $('error').textContent = 'パスワードを入力してください'; $('startBtn').disabled = false; $('startBtn').textContent = 'この台で開始'; return; }
  try{
  const superSpeedAllowed=customerLogin?await chooseCustomerSpeed():undefined;
  if(superSpeedAllowed===null){$('startBtn').disabled=false;$('startBtn').textContent='この台で開始';return;}
  const res = await fetch('/api/sessions/start', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password, requestedMachineId:entryMachineId,...(customerLogin?{userId:$('userId').value.trim(),superSpeedAllowed}: {})}),signal:AbortSignal.timeout(12000)});
  const data = await res.json();
  if(!data.ok){ $('error').textContent = friendlyError(data.error); $('startBtn').disabled = false; $('startBtn').textContent = 'この台で開始'; return; }
  active = data.session;
  $('password').value='';
  $('password').dispatchEvent(new Event('change'));
  resumeState=data.resumeState||null;machineDisplayBaseline=data.machineDisplayBaseline||null;
  novaHandoff=new URL(data.iframeUrl,location.href).searchParams.get('resumeFromStore')==='1';
  $('machineLabel').textContent = machineName(active.machineId);
  $('playerLabel').textContent = active.playerName ? ` / ${active.playerName}` : '';
  slotOrigin = new URL(data.iframeUrl, location.href).origin;
  $('slot').src = data.iframeUrl;
  $('login').hidden = true;
  $('play').hidden = false;
  $('ended').hidden = true;
  wakeSessionWatch();
  }catch(error){
    $('error').textContent = '通信できませんでした。同じパスワードでもう一度お試しください。';
  }
  $('startBtn').disabled = false;
  $('startBtn').textContent = 'この台で開始';
}
function closeEndedSession(){
  if(!active) return;
  clearTimeout(sessionWatchTimer);sessionWatchTimer=null;
  clearSlotLocalState();
  active=null;slotOrigin='';
  // Unload the iframe, including AUTO timers, audio and outstanding game callbacks.
  $('slot').src='about:blank';
  $('play').hidden=true;$('login').hidden=true;$('ended').hidden=false;
  $('endSummary').textContent='管理側で終了・リセットされたため、この台での遊技を終了しました。';
  $('sendStatus').textContent='再開する場合は、管理者に新しいパスワードの発行を依頼してください。';
}
async function checkSessionStatus(){
  if(!active || endingSession) return;
  if(sessionWatchInFlight){sessionWatchRequested=true;return;}
  clearTimeout(sessionWatchTimer);sessionWatchTimer=null;
  sessionWatchInFlight=true;sessionWatchRequested=false;
  const checkedSession=active;
  try{
    const res=await fetch('/api/sessions/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:checkedSession.sessionId,token:checkedSession.token}),cache:'no-store',signal:AbortSignal.timeout(8000)});
    const data=await res.json();
    if(active!==checkedSession || endingSession)return;
    if(res.status===403 || (res.ok && data.ok && data.active===false))closeEndedSession();
  }catch(error){ /* Transient network errors must not be mistaken for forced termination. */ }
  finally{
    sessionWatchInFlight=false;
    if(active && !endingSession)sessionWatchTimer=setTimeout(checkSessionStatus,sessionWatchRequested?0:3000);
  }
}
function wakeSessionWatch(){
  if(!active || endingSession)return;
  if(sessionWatchInFlight){sessionWatchRequested=true;return;}
  clearTimeout(sessionWatchTimer);sessionWatchTimer=setTimeout(checkSessionStatus,0);
}
window.addEventListener('focus',wakeSessionWatch);
window.addEventListener('pageshow',wakeSessionWatch);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)wakeSessionWatch();});
function clearSlotLocalState(){
  try{
    const win = $("slot").contentWindow;
    for(const name of ["__jackspotClearLocalPlayState", "__jagClearLocalPlayState"]){
      if(win && typeof win[name] === "function"){ win[name](); break; }
    }
  }catch(e){}
}
function latestSlotSnapshot(){
  try{
    const win = $("slot").contentWindow;
    for(const name of ["__jackspotPrepareEndSnapshot", "__jagPrepareEndSnapshot", "__jackspotAdminSnapshot", "__jagAdminSnapshot"]){
      if(win && typeof win[name] === "function") return win[name]();
    }
  }catch(e){}
  return null;
}
function requestSlotSnapshot(){
  return new Promise((resolve,reject)=>{
    const requestId=crypto.randomUUID();
    const timer=setTimeout(()=>{pendingSnapshot=null;reject(Error('台の保存状態を確認できません。画面を閉じずに終了を再実行してください。'));},12000);
    pendingSnapshot={requestId,resolve:value=>{clearTimeout(timer);pendingSnapshot=null;resolve(value);}};
    $('slot').contentWindow.postMessage({type:'nova-store-prepare-end',sessionId:active.sessionId,requestId},slotOrigin);
  });
}
async function endSession(options={}){
  if(!active || endingSession) return;
  if(!options.skipConfirm && !confirm(customerLogin?'終了してデータを送信し、台を空席に戻します。再度遊ぶ場合は台選びからログインしてください。':'終了してデータを送信します。終了後はこのパスワードでは続きから遊べません。')) return;
  endingSession=true;
  clearTimeout(sessionWatchTimer);sessionWatchTimer=null;
  $('endBtn').disabled = true;
  try{
  let snapshot = options.snapshot || (novaHandoff ? await requestSlotSnapshot() : latestSlotSnapshot());
  if(!snapshot){
    $('endBtn').textContent = '最新データ同期中...';
    try{
      const prepareResponse = await fetch('/api/sessions/prepare-end', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(active)});
      if(prepareResponse.ok) await new Promise(resolve=>setTimeout(resolve, 5600));
    }catch(error){}
    snapshot = latestSlotSnapshot();
  }
  $('endBtn').textContent = '送信中...';
    const res = await fetch('/api/sessions/end', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({...active, snapshot, forced:!!options.forced})});
    const data = await res.json().catch(()=>({}));
    if(!res.ok || !data.ok) throw new Error(data.error || '終了処理に失敗しました');
    clearSlotLocalState();
    active = null;
    slotOrigin = '';
    $('play').hidden = true;
    $('slot').src = 'about:blank';
    $('ended').hidden = false;
    $('sendStatus').textContent = data.sheets && data.sheets.ok ? 'スプレッドシートへ送信済みです。' : '終了データを保存しました。Sheets未連携または送信失敗時は管理画面で確認してください。';
  }catch(error){
    $('endBtn').disabled = false;
    $('endBtn').textContent = '終了してデータ送信';
    alert(error.message || '終了処理に失敗しました。画面を閉じずに再実行してください。');
  }finally{
    endingSession=false;
    if(active)wakeSessionWatch();
  }
}
const speedUsageRecorded=new Set(),speedUsagePending=new Set(),speedUsageRetry=new Map();
async function recordSuperSpeedUsage(){
  if(!active||endingSession)return;
  const session=active,day=new Date(Date.now()+9*3600000).toISOString().slice(0,10),key=session.sessionId+':'+day;
  if(speedUsageRecorded.has(key)||speedUsagePending.has(key)||Date.now()<(speedUsageRetry.get(key)||0))return;
  speedUsagePending.add(key);
  try{
    const res=await fetch('/api/sessions/super-speed-used',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:session.sessionId,token:session.token}),signal:AbortSignal.timeout(8000),keepalive:true});
    const data=await res.json();
    if(!res.ok||!data.ok)throw Error('usage not saved');
    speedUsageRecorded.add(key);
  }catch(error){speedUsageRetry.set(key,Date.now()+10000);}
  finally{speedUsagePending.delete(key);}
}
window.addEventListener('message', event=>{
  if(event.source !== $('slot').contentWindow) return;
  if(slotOrigin && event.origin !== slotOrigin) return;
  const msg = event.data || {};
  if(active && msg.sessionId===active.sessionId){
    if(msg.type==='nova-super-speed-used'){void recordSuperSpeedUsage();return;}
    if(msg.type==='nova-store-ready'){
      event.source.postMessage({type:'nova-store-bootstrap',sessionId:active.sessionId,resumeState,machineDisplayBaseline},slotOrigin);return;
    }
    if(msg.type==='nova-store-end-ready'&&pendingSnapshot?.requestId===msg.requestId&&msg.snapshot?.playSessionId===active.sessionId){
      pendingSnapshot.resolve(msg.snapshot);return;
    }
  }
  if(!msg || !['jag-force-end', 'jackspot-force-end', 'vertex-force-end'].includes(msg.type)) return;
  if(active && (!msg.machineId || String(msg.machineId) === String(active.machineId))){
    endSession({skipConfirm:true, forced:true, snapshot:msg.snapshot || latestSlotSnapshot()});
  }
});
$('startBtn').addEventListener('click', start);
$('password').addEventListener('keydown', e=>{ if(e.key === 'Enter') start(); });
$('endBtn').addEventListener('click', endSession);
loadBranding();
</script>
</body>
</html>
