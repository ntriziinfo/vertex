<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VERTEX 台選び</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#090b10;color:#f8f3df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif} header{padding:22px 24px;border-bottom:1px solid #2a303b;background:#11151d}h1{margin:0;font-size:28px}.muted{color:#9da8ba}.grid{padding:18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.machine{background:#151a23;border:1px solid #303847;border-radius:8px;padding:14px;display:grid;gap:10px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.head h2{margin:0}.pill{font-size:13px;border-radius:999px;padding:4px 9px;background:#303848}.pill.free{background:#1f7a48}.pill.lock{background:#8a5422}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{background:#0e1118;border-radius:6px;padding:8px}.stat span{display:block;color:#93a0b5;font-size:12px}.stat b{font-size:16px}.graph{width:100%;height:180px;background:#0b0e14;border:1px solid #2b3342;border-radius:6px}.actions{display:flex;gap:8px}.actions a{display:inline-grid;place-items:center;height:38px;border-radius:6px;padding:0 12px;background:#f0c85a;color:#211600;text-decoration:none;font-weight:900}.actions a.disabled{pointer-events:none;opacity:.45;background:#424a57;color:#d2d7df}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<header><h1><span id="storeName">VERTEX</span> 台選び</h1><p class="muted">管理リセット以降の台累計データを表示しています。</p></header>
<main id="grid" class="grid"></main>
<script>
const grid = document.getElementById('grid');
function fmt(n){ return Number(n || 0).toLocaleString('ja-JP'); }
function signed(n){ n = Number(n || 0); return (n >= 0 ? '+' : '') + fmt(n); }
function esc(value){ return String(value ?? '').replace(/[&<>"']/g, char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])); }
function draw(canvas, points){
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, Math.floor(rect.width * dpr));
  canvas.height = Math.max(1, Math.floor(rect.height * dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const w = rect.width, h = rect.height;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = '#0b0e14'; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = '#273044'; ctx.lineWidth = 1;
  for(let i=1;i<5;i++){ const y = h*i/5; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  points = Array.isArray(points) && points.length ? points : [{spin:0, profit:0}];
  const profits = points.map(p=>Number(p.profit)||0);
  let min = Math.min(0, ...profits), max = Math.max(0, ...profits);
  if(min === max){ min -= 100; max += 100; }
  const xFor = i => points.length <= 1 ? 0 : i * w / (points.length - 1);
  const yFor = v => h - ((v - min) / (max - min)) * h;
  const zero = yFor(0);
  ctx.strokeStyle = '#6b7280'; ctx.beginPath(); ctx.moveTo(0, zero); ctx.lineTo(w, zero); ctx.stroke();
  ctx.strokeStyle = profits[profits.length-1] >= 0 ? '#62ff9a' : '#ff5c70'; ctx.lineWidth = 2;
  ctx.beginPath(); points.forEach((p,i)=>{ const x = xFor(i), y = yFor(Number(p.profit)||0); if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y); }); ctx.stroke();
}
function visibleMachines(machines){ return Array.isArray(machines) ? machines : []; }
function render(machines){
  grid.innerHTML = visibleMachines(machines).map(m=>{
    const s = m.machineTotalStats || {}; const profit = s.profit ?? ((s.totalPaid||0)-(s.totalFee||0));
    const free = !m.locked;
    return `<article class="machine">
      <div class="head"><h2>${esc(m.displayName || m.machineId)}</h2><span class="pill ${free ? 'free' : 'lock'}">${free ? '空き' : '使用不可'}</span></div>
      <canvas class="graph" data-machine="${esc(m.machineId)}"></canvas>
      <div class="stats"><div class="stat"><span>G数</span><b>${fmt(s.totalSpins)}</b></div><div class="stat"><span>投入</span><b>${fmt(s.totalFee)}pt</b></div><div class="stat"><span>払出</span><b>${fmt(s.totalPaid)}pt</b></div><div class="stat"><span>差pt</span><b>${signed(profit)}</b></div></div>
      <div class="actions"><a class="${free ? '' : 'disabled'}" href="/play.html?machine=${encodeURIComponent(m.machineId)}">この台で遊ぶ</a></div>
    </article>`;
  }).join('');
  for(const m of visibleMachines(machines)){ const c = document.querySelector(`canvas[data-machine="${m.machineId}"]`); if(c) draw(c, m.machineTotalSlumpHistory); }
}
let lastMachines = [];
async function load(){
  const [configResponse, machinesResponse] = await Promise.all([fetch('/api/config'), fetch('/api/machines')]);
  const config = await configResponse.json();
  lastMachines = await machinesResponse.json();
  if(config.storeName){ document.getElementById('storeName').textContent = config.storeName; document.title = `${config.storeName} 台選び`; }
  render(lastMachines);
}
setInterval(load, 60000);
window.addEventListener("resize", ()=>render(lastMachines));
load();
</script>
</body>
</html>
